name: ScreenStatesDemo
options:
  bundleIdPrefix: com.marinaoreshina.screenstates
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
packages:
  ScreenStates:
    path: ../..
targets:
  ScreenStatesDemo:
    type: application
    platform: iOS
    sources:
      - path: ScreenStatesDemo
    dependencies:
      - package: ScreenStates
        product: ScreenStates
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marinaoreshina.screenstates.demo
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "ScreenStates Demo"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
