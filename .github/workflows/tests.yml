name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run swift-format
        run: swift format lint --configuration .swift-format --recursive --strict Sources Tests

  docs:
    name: Build DocC catalog
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build documentation
        run: |
          set -euo pipefail
          xcodebuild docbuild \
            -scheme ScreenStates \
            -destination 'generic/platform=iOS' \
            OTHER_DOCC_FLAGS="--warnings-as-errors"

  test:
    name: Test on iOS Simulator
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run tests
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("iPhone"))][0].udid')
          echo "Using simulator $UDID"
          xcodebuild test \
            -scheme ScreenStates \
            -destination "platform=iOS Simulator,id=$UDID" \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult

      # Self-hosted shields.io "endpoint" badge — no external coverage
      # service or secret needed. Only runs on pushes to main (not PRs,
      # which may come from forks without push access) and skips
      # committing when the percentage hasn't changed.
      - name: Update coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          PERCENT=$(xcrun xccov view --report --json TestResults.xcresult | jq '(.targets[] | select(.name == "ScreenStates") | .lineCoverage) * 100 | floor')
          COLOR="red"
          if [ "$PERCENT" -ge 80 ]; then COLOR="brightgreen"; elif [ "$PERCENT" -ge 60 ]; then COLOR="yellow"; fi
          mkdir -p .github/badges
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$PERCENT" "$COLOR" > .github/badges/coverage.json

          if git diff --quiet -- .github/badges/coverage.json; then
            echo "Coverage unchanged ($PERCENT%), nothing to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.json
          git commit -m "ci: update coverage badge to ${PERCENT}% [skip ci]"
          git push

  # A canary for upcoming toolchain breakage: builds and tests against
  # whatever's the newest Xcode already installed on the runner image,
  # which is the beta once one ships ahead of the next GA release.
  # continue-on-error so a beta-only regression never blocks `test` above.
  test-xcode-beta:
    name: Test on iOS Simulator (latest Xcode beta)
    runs-on: macos-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select the newest installed Xcode
        run: |
          set -euo pipefail
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Run tests
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("iPhone"))][0].udid')
          echo "Using simulator $UDID"
          xcodebuild test \
            -scheme ScreenStates \
            -destination "platform=iOS Simulator,id=$UDID"

  # Guards against a regression that only shows up on an older (but still
  # supported) Xcode — the runner image's default `xcode-select` is
  # whatever's newest, same as `test` above, so this exists specifically
  # to also cover the one before it. Unlike test-xcode-beta, this blocks
  # merging: these are both still-supported GA releases, not a preview.
  test-xcode-matrix:
    name: Test on iOS Simulator (last two Xcode versions)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        index: [0, 1]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode version
        run: |
          set -euo pipefail
          VERSIONS=($(ls -d /Applications/Xcode*.app | grep -v beta | sort -Vr))
          if [ "${{ matrix.index }}" -ge "${#VERSIONS[@]}" ]; then
            echo "Only ${#VERSIONS[@]} GA Xcode version(s) installed on this runner; skipping index ${{ matrix.index }}."
            exit 0
          fi
          SELECTED="${VERSIONS[${{ matrix.index }}]}"
          echo "Selecting $SELECTED"
          sudo xcode-select -s "$SELECTED/Contents/Developer"
          xcodebuild -version

      - name: Run tests
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("iPhone"))][0].udid')
          echo "Using simulator $UDID"
          xcodebuild test \
            -scheme ScreenStates \
            -destination "platform=iOS Simulator,id=$UDID"
